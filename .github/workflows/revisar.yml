name: revisar
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pruebas:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: bash pruebas/correr.sh
