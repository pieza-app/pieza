# Publica la página (docs/) con los datos al día: catálogo desde los pieza.json, las apps con el topic «hecho-con-pieza» y las
# skills en .zip. Corre en cada cambio y una vez al día (para el contador). Pages: Settings → Pages → Source: GitHub Actions.
name: pagina
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pagina
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 herramientas/pagina.py todo
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: despliegue
        uses: actions/deploy-pages@v4
