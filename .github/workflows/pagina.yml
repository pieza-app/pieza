# Publica la página (docs/) con los datos al día: catálogo desde los pieza.json, las apps con el topic «hecho-con-pieza» y las
# skills en .zip. Corre en cada cambio y una vez al día (para el contador). Pages: Settings → Pages → Source: GitHub Actions.
name: pagina
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: pagina
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    # Solo lo que necesita: leer el repo (y la lista pública de repos con el topic) y publicar en Pages.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python3 herramientas/pagina.py todo
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - id: despliegue
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
