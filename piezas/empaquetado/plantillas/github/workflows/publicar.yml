# Publica una versión de {{nombre}} sola: basta con subir «version» en app.json y hacer push a main. Compila {{#si mac}}Mac{{/si}}{{#si escritorio}}{{#si mac}}, {{/si}}{{#si windows}}Windows{{/si}}{{#si windows}}{{#si linux}} y {{/si}}{{/si}}{{#si linux}}Linux{{/si}}{{/si}}, arma
# cada descarga con su huella SHA-256 y crea el Release vX.Y.Z con nombres fijos (los usan instalar.sh, instalar.ps1 y el
# actualizador de la app): {{#si mac}}{{nombre_ascii}}-macOS.zip {{/si}}{{#si windows}}{{nombre_ascii}}-Windows.exe {{/si}}{{#si linux}}{{nombre_ascii}}-Linux.AppImage {{nombre_ascii}}-Linux.tar.gz {{#si app.empaquetado.deb}}{{nombre_ascii}}-Linux.deb {{/si}}{{/si}}(+ .sha256 de cada uno).
# Si la versión ya existe, no hace nada. Actions fijadas por SHA (Dependabot las sube), permisos mínimos, sin credenciales guardadas
# y ninguna expresión de GitHub dentro de `run:` (pasan por `env:`).
# Generado por la pieza «empaquetado» de Pieza desde app.json: si lo cambias, desde ahí es de la app y Pieza ya no lo toca.
name: Publicar versión
on:
  push:
    branches: [main]
    paths: ["app.json"]
    tags: ["v*"]
  workflow_dispatch:
concurrency:
  group: publicar
  cancel-in-progress: false
# Todo lee; solo el último paso (crear el Release) puede escribir.
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      publicar: ${{ steps.v.outputs.publicar }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Pruebas rápidas (no se publica una versión rota)
        # Las mismas de revisar.yml (sin Playwright, la interfaz se salta): contrato, todos los pruebas/test_*.py y privacidad.
        run: |
          if [ -f pruebas/correr.sh ]; then bash pruebas/correr.sh
          else [ ! -f pruebas/contrato.py ] || python3 pruebas/contrato.py
            if ls pruebas/test_*.py >/dev/null 2>&1; then python3 -m unittest discover -s pruebas -p 'test_*.py'; fi; fi
      - id: v
        env: { GH_TOKEN: "${{ github.token }}", REF: "${{ github.ref }}", REF_NOMBRE: "${{ github.ref_name }}" }
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then V="${REF_NOMBRE#v}"
          else V=$(python3 -c "import json;print(json.load(open('app.json'))['version'])"); fi
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Versión inválida: $V"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publicar=false" >> "$GITHUB_OUTPUT"; echo "v$V ya está publicada: nada que hacer."
          else echo "publicar=true" >> "$GITHUB_OUTPUT"; echo "Se publicará v$V"; fi
{{#si mac}}

  macos:
    needs: version
    if: needs.version.outputs.publicar == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Versión (la del Release, en app.json de esta copia)
        env: { VERSION: "${{ needs.version.outputs.version }}" }
        run: python3 -c "import json,os;d=json.load(open('app.json'));d['version']=os.environ['VERSION'];json.dump(d,open('app.json','w'),ensure_ascii=False,indent=1)"
      - name: Empaquetar (la versión sale de app.json)
        run: bash herramientas/empaquetar.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: macos, path: "dist/{{nombre_ascii}}-macOS.zip*" }
{{/si}}
{{#si escritorio}}

  escritorio:
    needs: version
    if: needs.version.outputs.publicar == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults: { run: { working-directory: escritorio } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Herramientas
        run: sudo apt-get update && sudo apt-get install -y nsis xvfb
      - name: Versión
        env: { VERSION: "${{ needs.version.outputs.version }}" }
        run: npm version --no-git-tag-version --allow-same-version "$VERSION"
      # Exactamente lo del package-lock.json y sin scripts de instalación (.npmrc: ignore-scripts).
      - run: npm ci && npm audit --audit-level=high
{{#si linux}}
      - name: Linux (AppImage, tar.gz{{#si app.empaquetado.deb}} y deb{{/si}})
        run: |
          bash herramientas/preparar.sh linux
          npx electron-builder --linux AppImage tar.gz{{#si app.empaquetado.deb}} deb{{/si}}
          (cd dist && for f in {{nombre_ascii}}-Linux.AppImage {{nombre_ascii}}-Linux.tar.gz{{#si app.empaquetado.deb}} {{nombre_ascii}}-Linux.deb{{/si}}; do sha256sum "$f" > "$f.sha256"; done)
      - name: La app de Linux empaquetada abre (pantalla virtual)
        run: |
          [ -f pruebas/arranque.mjs ] || { echo "Sin escritorio/pruebas/arranque.mjs: no la abro."; exit 0; }
          npm i --no-save --ignore-scripts --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" ELECTRON=dist/linux-unpacked/{{id}} APP=1 SOLO_ARRANQUE=1 xvfb-run -a node pruebas/arranque.mjs
{{/si}}
{{#si windows}}
      - name: Windows (instalador)
        run: |
          bash herramientas/preparar.sh windows
          npx electron-builder --win dir
          bash herramientas/instalador-windows.sh
{{/si}}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: escritorio
          path: |
{{#si windows}}
            escritorio/dist/{{nombre_ascii}}-Windows.exe*
{{/si}}
{{#si linux}}
            escritorio/dist/{{nombre_ascii}}-Linux.*
{{/si}}
{{/si}}

  release:
    needs: [version{{#si mac}}, macos{{/si}}{{#si escritorio}}, escritorio{{/si}}]
    permissions:
      contents: write
    if: {{#si mac}}needs.macos.result == 'success'{{/si}}{{#si mac}}{{#si escritorio}} && {{/si}}{{/si}}{{#si escritorio}}needs.escritorio.result == 'success'{{/si}}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: descargas, merge-multiple: true }
      - name: Crear el Release
        env: { GH_TOKEN: "${{ github.token }}", VERSION: "${{ needs.version.outputs.version }}", REPO: "${{ github.repository }}", SHA: "${{ github.sha }}" }
        run: |
          V="v$VERSION"
          ls -la descargas
          for f in {{#si mac}}{{nombre_ascii}}-macOS.zip {{/si}}{{#si windows}}{{nombre_ascii}}-Windows.exe {{/si}}{{#si linux}}{{nombre_ascii}}-Linux.AppImage {{nombre_ascii}}-Linux.tar.gz {{#si app.empaquetado.deb}}{{nombre_ascii}}-Linux.deb {{/si}}{{/si}}; do
            [ -f "descargas/$f" ] && [ -f "descargas/$f.sha256" ] || { echo "Falta $f o su huella"; exit 1; }
          done
          gh release create "$V" descargas/* --repo "$REPO" --target "$SHA" --title "{{nombre}} $V" --generate-notes
