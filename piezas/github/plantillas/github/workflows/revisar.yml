# Revisión automática de cada cambio (y de cada pull request): si algo falla, se ve antes de que llegue a alguien.
# - revisar: bash pruebas/correr.sh (contrato del puente, Python, interfaz con Playwright, privacidad) con capturas para mirar.
{{#si mac}}
# - mac: que la app de Mac compile (solo si cambió app/, app.json, acciones.json o el empaquetado).
{{/si}}
# Actions fijadas por SHA con su versión en un comentario (Dependabot las sube), permisos mínimos, sin credenciales guardadas y
# ninguna expresión de GitHub dentro de `run:`. ubuntu-24.04 y no -latest: Playwright todavía no trae Chromium para 26.04.
# Generado por la pieza «github» de Pieza desde app.json: si lo cambias, desde ahí es de la app y Pieza ya no lo toca.
name: Revisar
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: revisar-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  revisar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Playwright (la interfaz en un navegador de verdad)
        run: |
          npm i --no-save --ignore-scripts --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Pruebas
        run: |
          mkdir -p capturas
          CAPTURAS="$PWD/capturas" bash pruebas/correr.sh
      - name: Capturas para revisar a ojo
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: capturas, path: capturas, retention-days: 14, if-no-files-found: ignore }
{{#si mac}}

  mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: ¿Cambió algo de la app de Mac?
        id: cambio
        env: { ANTES: "${{ github.event.before }}", EVENTO: "${{ github.event_name }}" }
        run: |
          if [ "$EVENTO" != "push" ] || ! git cat-file -e "$ANTES" 2>/dev/null || git diff --name-only "$ANTES" HEAD | grep -qE '^(app/|app\.json|acciones\.json|herramientas/empaquetar\.sh|build\.sh)'; then echo "si=1" >> "$GITHUB_OUTPUT"; fi
      - name: Compilar
        if: steps.cambio.outputs.si == '1'
        run: cd app && swift build -c release
{{/si}}
